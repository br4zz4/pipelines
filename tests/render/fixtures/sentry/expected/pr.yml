name: pr
on:
  pull_request:
permissions:
  contents: read
  id-token: write
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conform:
    name: conform
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
      - name: conform
        uses: br4zz4/pipelines/actions/conform@v2
        with:
          mode: fix
          vault: has_warranty
          key: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.WARD_KEY_HAS_WARRANTY || '' }}
  detect:
    name: detect
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      changes: ${{ steps.detect.outputs.changes }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: detect
        id: detect
        uses: br4zz4/pipelines/actions/detect@v2
  core-changes:
    name: core / changes
    needs: [ conform, detect ]
    if: ${{ fromJSON(needs.detect.outputs.changes).core.any }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      code: ${{ fromJSON(needs.detect.outputs.changes).core.code }}
      infra: ${{ fromJSON(needs.detect.outputs.changes).core.infra }}
    steps:
      - name: changes
        env:
          CHANGES: ${{ toJSON(fromJSON(needs.detect.outputs.changes).core) }}
        run: echo "core changes ${CHANGES}" >> "${GITHUB_STEP_SUMMARY}"
  core-code:
    name: core / code
    needs: core-changes
    if: ${{ needs.core-changes.outputs.code == 'true' }}
    uses: br4zz4/pipelines/.github/workflows/code.yml@v2
    with:
      module: core
      vault: has_warranty
      code_dir: modules/core/code
      services: postgres
    secrets:
      WARD_KEY: ${{ secrets.WARD_KEY_HAS_WARRANTY }}
  core-infra:
    name: core / infra
