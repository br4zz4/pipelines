name: ci
on: pull_request
jobs:
  core:
    name: check/core
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Step 1
        uses: actions/cache@v6
      - name: Step 2
        uses: jdx/mise-action@v5
      - name: Step 3
        uses: actions/upload-artifact@v7
      - name: Step 4
        uses: actions/download-artifact@v8
      - name: Step 5
        uses: actions/setup-node@v7
      - name: Test
        run: make test
