# requirements — a deploy only raises a release that already exists, and the
# ref decides which one:
#   - the run is on a tag  → that tag (and its image);
#   - the run is on a branch → the newest release tag pointing at this commit.
# There is no fallback: a commit without a release has no image, so there is
# nothing to raise. Production additionally requires the release to be green in
# staging for the module.
#
# Usage:
#   jobs:
#     requirements:
#       uses: br4zz4/pipelines/.github/workflows/requirements.yml@v1
#       with:
#         environment: production
#         module: main
name: requirements

on:
  workflow_call:
    inputs:
      environment:
        description: staging | production
        required: false
        type: string
        default: production
      module:
        description: Module of the release. Derived from the tag when empty.
        required: false
        type: string
        default: ''
    outputs:
      tag:
        description: The release tag
        value: ${{ jobs.requirements.outputs.tag }}
      module:
        description: The module of the release
        value: ${{ jobs.requirements.outputs.module }}

permissions:
  contents: read
  deployments: read

jobs:
  requirements:
    name: requirements / ${{ inputs.module || github.ref_name }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      module: ${{ steps.pick.outputs.module }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Pick the release of this ref
        id: pick
        shell: bash
        env:
          MODULE: ${{ inputs.module }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${REF_TYPE}" = "tag" ]; then
            tag="${REF_NAME}"
          else
            git fetch --tags --force origin >/dev/null 2>&1 || true
            releases="$(git tag --points-at HEAD | grep -E '^[A-Za-z_][A-Za-z0-9_-]*\.[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$' || true)"
            if [ -n "${MODULE}" ]; then
              releases="$(printf '%s\n' "${releases}" | grep -E "^${MODULE}\." || true)"
            fi
            tag="$(printf '%s\n' "${releases}" | sed '/^$/d' | sort -V | tail -n 1)"
          fi
          if [ -z "${tag}" ]; then
            echo "::error::this commit has no release tag; a deploy only raises a release (push to main first)"
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "module=${MODULE:-${tag%%.*}}" >> "${GITHUB_OUTPUT}"
          echo "picked: ${tag}"

      - name: Require it passed in staging
        if: inputs.environment == 'production'
        uses: br4zz4/pipelines/actions/resolve@v1
        with:
          environment: staging
          module: ${{ steps.pick.outputs.module }}
          tag: ${{ steps.pick.outputs.tag }}

      - name: Verify the release tag
        uses: br4zz4/pipelines/actions/requirements@v1
        with:
          tag: ${{ steps.pick.outputs.tag }}
