# requirements — the ref decides the releases; production requires every release
# green in staging (validated by the rollout).
#
#   run on a tag    → that tag, and the modules it names
#   run on a branch → every release tag pointing at the commit of the run
#
# A tag whose message carries a `tracks:` line names its modules there.
# There is no fallback: a commit without a release tag has no image, so there is
# nothing to raise. The output is a matrix of `{module, tag}` — one commit may
# carry the release of several modules.
#
# Usage:
#   jobs:
#     requirements:
#       uses: br4zz4/pipelines/.github/workflows/requirements.yml@v1
#       with:
#         environment: production
name: requirements

on:
  workflow_call:
    inputs:
      environment:
        description: staging | production
        required: false
        type: string
        default: production
    outputs:
      releases:
        description: JSON matrix of {module, tag} releases of this ref
        value: ${{ jobs.requirements.outputs.releases }}

permissions:
  contents: read

jobs:
  requirements:
    name: requirements / ${{ github.ref_name }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      releases: ${{ steps.pick.outputs.releases }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Pick the releases of this ref
        id: pick
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          RELEASE = re.compile(r"^[A-Za-z_][A-Za-z0-9_-]*\.\d{4}-\d{2}-\d{2}\.\d{3,}$")
          BRANCH_RELEASE = re.compile(r"^[A-Za-z_][A-Za-z0-9_-]*\.\d{4}-\d{2}-\d{2}\.")


          def git(*args):
              return subprocess.run(
                  ["git", *args], capture_output=True, text=True, check=True
              ).stdout


          def modules(tag):
              if RELEASE.match(tag):
                  return [tag.split(".", 1)[0]]
              # Legacy tag: the annotated message carries `tracks: main,checkout`.
              message = git("tag", "-l", "--format=%(contents)", tag)
              for line in message.splitlines():
                  key, sep, value = line.partition(":")
                  if sep and key.strip().lower() == "tracks":
                      return [name for name in re.split(r"[,\s]+", value.strip()) if name]
              return []


          def releases():
              if os.environ["REF_TYPE"] == "tag":
                  tags = [os.environ["REF_NAME"]]
              else:
                  subprocess.run(
                      ["git", "fetch", "--tags", "--force", "origin"],
                      capture_output=True,
                      text=True,
                  )
                  tags = [
                      tag
                      for tag in git("tag", "--points-at", "HEAD").splitlines()
                      if BRANCH_RELEASE.match(tag)
                  ]
              entries = []
              for tag in sorted(set(tags)):
                  entries += [{"module": name, "tag": tag} for name in modules(tag)]
              wanted = os.environ.get("MODULE", "").strip()
              if wanted:
                  entries = [entry for entry in entries if entry["module"] == wanted]
              unique = []
              for entry in entries:
                  if entry not in unique:
                      unique.append(entry)
              return unique


          found = releases()
          if not found:
              print(
                  "::error::this commit has no release tag; a deploy only raises a release (push to main first)",
                  file=sys.stderr,
              )
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(
                  "releases="
                  + json.dumps({"include": found}, separators=(",", ":"))
                  + "\n"
              )
          print("releases:", ", ".join(f"{entry['module']}={entry['tag']}" for entry in found))
          PY
