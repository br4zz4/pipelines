# requirements — a deploy only raises a real release: the tag exists and has the
# module shape; production also requires it recorded green in staging for that
# module. With no tag given, it resolves the newest green release of the module.
# Everything else in the deploy trusts this job.
#
# Usage:
#   jobs:
#     requirements:
#       uses: br4zz4/pipelines/.github/workflows/requirements.yml@v1
#       with:
#         environment: production
#         module: main
#         tag: ''          # empty resolves the newest green release of the module
name: requirements

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, `<module>.YYYY.MM.DD.N`. Empty resolves the newest green release.
        required: false
        type: string
        default: ''
      environment:
        description: staging | production
        required: false
        type: string
        default: production
      module:
        description: Module to resolve when no tag is given
        required: false
        type: string
        default: ''
    outputs:
      tag:
        description: The release tag
        value: ${{ jobs.requirements.outputs.tag }}
      module:
        description: The module of the release
        value: ${{ jobs.requirements.outputs.module }}

permissions:
  contents: read
  deployments: read

jobs:
  requirements:
    name: requirements / ${{ inputs.tag || inputs.module }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      deployments: read
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      module: ${{ steps.derive.outputs.module }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the newest green release of the module
        id: resolve
        if: inputs.tag == ''
        uses: br4zz4/pipelines/actions/resolve@v1
        with:
          environment: staging
          module: ${{ inputs.module }}

      - name: Require the given tag passed in staging
        if: inputs.tag != '' && inputs.environment == 'production'
        uses: br4zz4/pipelines/actions/resolve@v1
        with:
          environment: staging
          module: ${{ inputs.module }}
          tag: ${{ inputs.tag }}

      - name: Verify the release tag
        uses: br4zz4/pipelines/actions/requirements@v1
        with:
          tag: ${{ inputs.tag || steps.resolve.outputs.tag }}
          strict: ${{ inputs.tag != '' }}

      - name: Derive the release
        id: derive
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
          RESOLVED: ${{ steps.resolve.outputs.tag }}
          MODULE: ${{ inputs.module }}
        run: |
          tag="${TAG_INPUT:-${RESOLVED}}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "module=${MODULE:-${tag%%.*}}" >> "${GITHUB_OUTPUT}"
