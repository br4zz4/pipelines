# requirements — a deploy only raises a real release. The release is picked in
# this order:
#   1. the `tag` input, when given;
#   2. the tag the run is on, when dispatched from a tag;
#   3. the newest release tag pointing at this commit, when dispatched from a branch;
#   4. the newest release recorded green in staging, when the commit has none.
# Only (4) relaxes the commit pin; the tag format and its existence never relax.
# Production additionally requires the release to be green in staging.
#
# Usage:
#   jobs:
#     requirements:
#       uses: br4zz4/pipelines/.github/workflows/requirements.yml@v1
#       with:
#         environment: production
#         module: main
name: requirements

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, `<module>.YYYY.MM.DD.N`. Empty picks the release of this commit or the last green.
        required: false
        type: string
        default: ''
      environment:
        description: staging | production
        required: false
        type: string
        default: production
      module:
        description: Module to resolve when no release is given or found
        required: false
        type: string
        default: ''
    outputs:
      tag:
        description: The release tag
        value: ${{ jobs.requirements.outputs.tag }}
      module:
        description: The module of the release
        value: ${{ jobs.requirements.outputs.module }}

permissions:
  contents: read
  deployments: read

jobs:
  requirements:
    name: requirements / ${{ inputs.tag || inputs.module }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      module: ${{ steps.derive.outputs.module }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Pick the release of this run
        id: pick
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
          MODULE: ${{ inputs.module }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${TAG_INPUT}"
          if [ -z "${tag}" ] && [ "${REF_TYPE}" = "tag" ]; then
            tag="${REF_NAME}"
          fi
          if [ -z "${tag}" ]; then
            git fetch --tags --force origin >/dev/null 2>&1 || true
            releases="$(git tag --points-at HEAD | grep -E '^[A-Za-z_][A-Za-z0-9_-]*\.[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$' || true)"
            if [ -n "${MODULE}" ]; then
              releases="$(printf '%s\n' "${releases}" | grep -E "^${MODULE}\." || true)"
            fi
            tag="$(printf '%s\n' "${releases}" | sed '/^$/d' | sort -V | tail -n 1)"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "picked: ${tag:-<none on this commit>}"

      - name: Resolve the newest green release of the module
        id: resolve
        if: steps.pick.outputs.tag == ''
        uses: br4zz4/pipelines/actions/resolve@v1
        with:
          environment: staging
          module: ${{ inputs.module }}

      - name: Require it passed in staging
        if: inputs.environment == 'production' && steps.pick.outputs.tag != ''
        uses: br4zz4/pipelines/actions/resolve@v1
        with:
          environment: staging
          module: ${{ inputs.module }}
          tag: ${{ steps.pick.outputs.tag }}

      - name: Verify the release tag
        uses: br4zz4/pipelines/actions/requirements@v1
        with:
          tag: ${{ steps.pick.outputs.tag || steps.resolve.outputs.tag }}
          strict: ${{ steps.pick.outputs.tag != '' }}

      - name: Derive the release
        id: derive
        shell: bash
        env:
          PICKED: ${{ steps.pick.outputs.tag }}
          RESOLVED: ${{ steps.resolve.outputs.tag }}
          MODULE: ${{ inputs.module }}
        run: |
          tag="${PICKED:-${RESOLVED}}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "module=${MODULE:-${tag%%.*}}" >> "${GITHUB_OUTPUT}"
