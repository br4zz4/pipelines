# subtrack — one directory of one module, one leg per script. The scripts are the
# steps: <dir>/ci/<step>.sh. The toolchain belongs to the project, at
# .github/actions/setup, which also owns the authentication.
#
# Usage: called by the project's own entrypoint (checks on push/PR); do not call
# it directly.
name: subtrack

on:
  workflow_call:
    inputs:
      module:
        description: Module name
        required: true
        type: string
      dir:
        description: Directory of the subtrack, relative to the workspace
        required: true
        type: string
      changed:
        description: 'false skips the whole subtrack'
        required: false
        type: string
        default: 'true'
      steps_matrix:
        description: JSON matrix generated by detect from the directory's ci/*.sh
        required: false
        type: string
        default: '{"include":[{"step":"none"}]}'
      environment:
        description: staging | production
        required: false
        type: string
        default: staging
      tag:
        description: Release tag, exported to the steps as TAG and the checkout ref
        required: false
        type: string
        default: ''
    secrets:
      RUNTIME_CONFIG:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  steps:
    if: inputs.changed == 'true'
    name: ${{ matrix.step }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      MODULE: ${{ inputs.module }}
      ENVIRONMENT: ${{ inputs.environment }}
      TAG: ${{ inputs.tag }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.steps_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up the module
        uses: ./.github/actions/setup
        with:
          dir: ${{ inputs.dir }}
          environment: ${{ inputs.environment }}
          runtime-config: ${{ secrets.RUNTIME_CONFIG }}

      - name: ${{ matrix.step }}
        uses: br4zz4/pipelines/actions/hook@v1
        with:
          step: ${{ matrix.step }}
          dir: ${{ inputs.dir }}
