# module — as duas subtrilhas de UM módulo, na ordem que importa num deploy:
# infra primeiro (o terraform é o que cria os serviços da release), código depois.
# Infracção em infra para o deploy: não se promove código sobre infra pela metade.
name: module

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      environment:
        required: true
        type: string
      tag:
        required: true
        type: string
      code:
        required: false
        type: string
        default: 'true'
      infra:
        required: false
        type: string
        default: 'false'
      code_dir:
        required: false
        type: string
        default: ''
      steps_matrix:
        required: false
        type: string
        default: '{"include":[{"step":"none"}]}'
      e2e:
        required: false
        type: string
        default: 'false'
      module_dir:
        required: false
        type: string
        default: ''
      region:
        required: false
        type: string
        default: us-west1
      image:
        required: false
        type: string
        default: ''
      source_image:
        required: false
        type: string
        default: ''
      url:
        required: false
        type: string
        default: ''
      prefix:
        required: false
        type: string
        default: ''
      tf_dir:
        required: false
        type: string
        default: ''
      tf_check_dir:
        required: false
        type: string
        default: ''
      tf_bucket:
        required: false
        type: string
        default: ''
      tf_state_prefix:
        required: false
        type: string
        default: ''
      tf_vars:
        required: false
        type: string
        default: '{}'
    secrets:
      GCP_WIF_PROVIDER:
        required: true
      GCP_DEPLOY_SA:
        required: true
      GCP_SOURCE_WIF_PROVIDER:
        required: false
      GCP_SOURCE_DEPLOY_SA:
        required: false
      NOTIFY_WEBHOOK_URL:
        required: false

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  infra:
    if: inputs.infra == 'true'
    uses: br4zz4/pipelines/.github/workflows/infra.yml@v1
    with:
      module: ${{ inputs.module }}
      changed: 'true'
      mode: apply
      tag: ${{ inputs.tag }}
      module_dir: ${{ inputs.module_dir }}
      tf_dir: ${{ inputs.tf_dir }}
      tf_check_dir: ${{ inputs.tf_check_dir }}
      tf_bucket: ${{ inputs.tf_bucket }}
      tf_state_prefix: ${{ inputs.tf_state_prefix }}
      tf_vars: ${{ inputs.tf_vars }}
      region: ${{ inputs.region }}
    secrets:
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}

  code:
    needs: infra
    if: ${{ always() && inputs.code == 'true' && !failure() && !cancelled() }}
    uses: br4zz4/pipelines/.github/workflows/line.yml@v1
    with:
      module: ${{ inputs.module }}
      environment: ${{ inputs.environment }}
      tag: ${{ inputs.tag }}
      code_dir: ${{ inputs.code_dir }}
      steps_matrix: ${{ inputs.steps_matrix }}
      e2e: ${{ inputs.e2e }}
      module_dir: ${{ inputs.module_dir }}
      region: ${{ inputs.region }}
      image: ${{ inputs.image }}
      source_image: ${{ inputs.source_image }}
      url: ${{ inputs.url }}
      prefix: ${{ inputs.prefix }}
    secrets:
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
      GCP_SOURCE_WIF_PROVIDER: ${{ secrets.GCP_SOURCE_WIF_PROVIDER }}
      GCP_SOURCE_DEPLOY_SA: ${{ secrets.GCP_SOURCE_DEPLOY_SA }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
