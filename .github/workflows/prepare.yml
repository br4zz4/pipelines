# prepare — the read-only half of the infra subtrack: render, plan or diff what
# the release would apply, without touching the environment. It is a gate, not a
# mutation: the tag only exists when this passes, and the rollout never plans.
#
# Usage:
#   jobs:
#     prepare:
#       uses: br4zz4/pipelines/.github/workflows/prepare.yml@v1
#       with:
#         module: main
#         dir: modules/main/infra
#         environment: staging
#       secrets:
#         RUNTIME_CONFIG: ${{ secrets.RUNTIME_CONFIG }}
name: prepare

on:
  workflow_call:
    inputs:
      module:
        description: Module name
        required: true
        type: string
      dir:
        description: Module infra directory, relative to the workspace
        required: true
        type: string
      environment:
        description: staging | production
        required: false
        type: string
        default: staging
      tag:
        description: Release tag, exported to the step as TAG and used as the checkout ref
        required: false
        type: string
        default: ''
    secrets:
      RUNTIME_CONFIG:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    name: prepare / ${{ inputs.module }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      MODULE: ${{ inputs.module }}
      ENVIRONMENT: ${{ inputs.environment }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up the module
        uses: ./.github/actions/setup
        with:
          dir: ${{ inputs.dir }}
          environment: ${{ inputs.environment }}
          runtime-config: ${{ secrets.RUNTIME_CONFIG }}

      - name: prepare
        uses: br4zz4/pipelines/actions/hook@v1
        with:
          step: prepare
          dir: ${{ inputs.dir }}
