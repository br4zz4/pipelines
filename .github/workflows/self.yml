# self — this repository checks itself. The pipeline definitions reference each
# other by contract, so a typo in a `with:` key is a runtime failure in a
# consuming project, not here.
name: self

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6

      - name: Python syntax
        run: python3 -m py_compile actions/*/*.py tasks/check.py

      - name: Contracts, outputs, matrices and workflow references
        run: python3 tasks/check.py

      - name: Detect fixtures
        run: sh tests/detect/run.sh

      - name: Shell scripts
        run: shellcheck -S warning actions/*/*.sh examples/*/infra/ci/*.sh tests/detect/run.sh

      - name: No obsolete workflows
        shell: bash
        run: |
          retired="infra-""prepare"
          for file in package.yml "${retired}.yml" deploy.yml; do
            if [ -e ".github/workflows/${file}" ]; then
              echo "::error::.github/workflows/${file} is obsolete"
              exit 1
            fi
          done
          token="infra-""prepare"
          if grep -rn "$token" .github/workflows actions; then
            echo "::error::'${token}' is obsolete: the read-only infra step is 'prepare'"
            exit 1
          fi
