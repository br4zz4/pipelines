# self — this repository checks itself. The pipeline definitions reference each
# other by contract, so a typo in a `with:` key is a runtime failure in a
# consuming project, not here.
name: self

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: syntax
        run: python3 -m py_compile actions/*/*.py tasks/check.py

      - name: contracts
        run: python3 tasks/check.py

      - name: rendered
        run: sh tasks/check_rendered.sh

      - name: detect
        run: sh tests/detect/run.sh

      - name: render
        run: sh tests/render/run.sh

      - name: conform
        run: sh tests/conform/run.sh

      - name: gate
        run: sh tests/gate/run.sh

      - name: releases
        run: sh tests/releases/run.sh

      - name: actions
        run: sh tests/actions/run.sh

      - name: standard
        run: sh tests/check/run.sh

      - name: shell
        run: shellcheck -S warning actions/*/*.sh examples/*/infra/ci/*.sh tests/*/run.sh tasks/check_rendered.sh
