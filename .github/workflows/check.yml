# check — pull request. Two matrices, one leg per module, filtered to the modules
# the change set touches:
#   code  → the scripts in <code_dir>/ci/ (minus setup and package)
#   infra → `check` and `plan`, when the module has them in <deploy_dir>/ci/
# When nothing changed each matrix carries a single sentinel leg (module `none`,
# `changed=false`), which the reusable workflow skips.
#
# Usage:
#   jobs:
#     check:
#       uses: br4zz4/pipelines/.github/workflows/check.yml@v1
#       secrets:
#         RUNTIME_CONFIG: ${{ secrets.RUNTIME_CONFIG }}
name: check

on:
  workflow_call:
    inputs:
      registry:
        description: Path to modules.json
        required: false
        type: string
        default: .github/modules.json
    secrets:
      RUNTIME_CONFIG:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.plan.outputs.code }}
      infra: ${{ steps.plan.outputs.infra }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: plan
        uses: br4zz4/pipelines/actions/plan@v1
        with:
          mode: check
          registry: ${{ inputs.registry }}

  code:
    needs: plan
    name: code · ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.code) }}
    uses: br4zz4/pipelines/.github/workflows/subtrack.yml@v1
    with:
      module: ${{ matrix.module }}
      dir: ${{ matrix.code_dir }}
      changed: ${{ matrix.changed }}
      steps_matrix: ${{ matrix.steps_matrix }}
      package: 'false'
      environment: staging
      tag: ''
    secrets:
      RUNTIME_CONFIG: ${{ secrets.RUNTIME_CONFIG }}

  infra:
    needs: plan
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    name: infra · ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.infra) }}
    uses: br4zz4/pipelines/.github/workflows/subtrack.yml@v1
    with:
      module: ${{ matrix.module }}
      dir: ${{ matrix.deploy_dir }}
      changed: ${{ matrix.changed }}
      steps_matrix: ${{ matrix.steps_matrix }}
      package: 'false'
      environment: staging
      tag: ''
    secrets:
      RUNTIME_CONFIG: ${{ secrets.RUNTIME_CONFIG }}
