# deploy — the deploy track, identical for staging and production. The environment
# is the only parameter: everything that differs (url) comes from the registry.
#
# Usage:
#   jobs:
#     deploy:
#       uses: br4zz4/pipelines/.github/workflows/deploy.yml@v1
#       with:
#         environment: production
#         tag: ${{ inputs.tag }}
#       secrets:
#         RUNTIME_CONFIG: ${{ secrets.RUNTIME_CONFIG }}
#         NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: staging | production
        required: true
        type: string
      tag:
        description: Release tag. Empty resolves the newest release recorded green in the environment.
        required: false
        type: string
        default: ''
      modules:
        description: Narrows the release to these modules. Empty deploys every module carried by the tag.
        required: false
        type: string
        default: ''
      registry:
        description: Path to modules.json
        required: false
        type: string
        default: .github/modules.json
    secrets:
      RUNTIME_CONFIG:
        required: false
      NOTIFY_WEBHOOK_URL:
        required: false

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      modules: ${{ steps.plan.outputs.modules }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the release modules
        id: plan
        uses: br4zz4/pipelines/actions/plan@v1
        with:
          mode: release
          environment: ${{ inputs.environment }}
          ref: ${{ inputs.tag }}
          modules: ${{ inputs.modules }}
          registry: ${{ inputs.registry }}

  deploy:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.modules) }}
    uses: br4zz4/pipelines/.github/workflows/track.yml@v1
    with:
      module: ${{ matrix.module }}
      module_dir: ${{ matrix.module_dir }}
      environment: ${{ inputs.environment }}
      tag: ${{ matrix.tag }}
      code_dir: ${{ matrix.code_dir }}
      deploy_dir: ${{ matrix.deploy_dir }}
      url: ${{ matrix.url }}
    secrets:
      RUNTIME_CONFIG: ${{ secrets.RUNTIME_CONFIG }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
