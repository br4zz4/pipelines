# deploy — one release of one module in one environment. The same track serves
# staging (a tag push) and production (a dispatch); only `environment` differs,
# and production only raises what staging recorded. It never builds.
#
#   preflight ─► apply ─► deployment ∥ migrate ─► rollout ─► verify ─► record ─► notify
#
# `record` also dispatches this same workflow on the failed ref with `rollback_to`
# when the release failed: the deploy then raises the last release recorded green,
# through the same jobs.
name: deploy

on:
  workflow_call:
    inputs:
      module:
        description: Module name
        required: true
        type: string
      vault:
        description: Ward namespace of the project
        required: true
        type: string
      production_key_secret:
        description: Name of the secret that holds the production vault key (the `::restricted` vault). The project chooses it; production jobs run in the `production` environment, so the secret can live only there. Empty defaults to WARD_KEY_<vault>_RESTRICTED, built from the vault input (secret names are case-insensitive). The staging key stays in the WARD_KEY secret.
        required: false
        type: string
        default: ''
      tag:
        description: Release tag, `<module>.YYYY-MM-DD.NNN`
        required: true
        type: string
      environment:
        description: staging | production
        required: true
        type: string
      services:
        description: 'Deprecated, ignored: verify runs without services'
        required: false
        type: string
        default: ''
      code_dir:
        description: Directory of the code side
        required: true
        type: string
      infra_dir:
        description: Directory of the infra side
        required: true
        type: string
      rollback_of:
        description: Release this deploy rolls back from; set by `releases` when the dispatch carries rollback_to, empty for a plain deploy
        required: false
        type: string
        default: ''
      staging_wait:
        description: Seconds to poll for the staging record before giving up (production only)
        required: false
        type: number
        default: 600
      require_promoted:
        description: Production only deploys a release the promote recorded as `promoted`, not just staging
        required: false
        type: boolean
        default: false
      promote_enabled:
        description: The project runs the promote workflow; production without `require_promoted` is then a forced deploy
        required: false
        type: boolean
        default: false
    secrets:
      WARD_KEY:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    name: preflight
    environment: ${{ inputs.environment == 'production' && 'production' || 'staging' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
    outputs:
      apply: ${{ steps.apply.outputs.needed }}
      previous: ${{ steps.apply.outputs.previous }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
      - name: restricted vault
        if: inputs.environment == 'production'
        env:
          RESTRICTED_KEY: ${{ secrets[inputs.production_key_secret || format('WARD_KEY_{0}_RESTRICTED', inputs.vault)] }}
        run: test -n "${RESTRICTED_KEY}" || { echo "::error::production needs the restricted vault key, so create the WARD_KEY_<vault>_RESTRICTED secret in the production environment (or set production_key_secret to another name), and a ::restricted vault"; exit 1; }
      - name: requirements
        uses: br4zz4/pipelines/actions/requirements@v2
        with:
          tag: ${{ inputs.tag }}
          strict: ${{ inputs.rollback_of == '' }}
      - name: staging record
        if: inputs.environment == 'production'
        uses: br4zz4/pipelines/actions/resolve@v2
        with:
          environment: ${{ inputs.require_promoted && 'promoted' || 'staging' }}
          module: ${{ inputs.module }}
          tag: ${{ inputs.tag }}
          wait: ${{ inputs.staging_wait }}
      - name: forced
        if: inputs.environment == 'production' && inputs.promote_enabled && !inputs.require_promoted
        run: echo "forced - promote skipped for ${{ inputs.tag }}" >> "${GITHUB_STEP_SUMMARY}"
      - name: rollback target
        if: inputs.rollback_of != ''
        uses: br4zz4/pipelines/actions/resolve@v2
        with:
          environment: ${{ inputs.environment }}
          module: ${{ inputs.module }}
          tag: ${{ inputs.tag }}
      - name: apply needed
        id: apply
        uses: br4zz4/pipelines/actions/apply-needed@v2
        with:
          force: ${{ inputs.rollback_of != '' }}
          environment: ${{ inputs.environment }}
          module: ${{ inputs.module }}
          tag: ${{ inputs.tag }}
  apply:
    name: apply
    environment: ${{ inputs.environment == 'production' && 'production' || 'staging' }}
    needs: preflight
    if: ${{ needs.preflight.outputs.apply == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.tag }}
      - name: apply
        uses: br4zz4/pipelines/actions/step@v2
        with:
          module: ${{ inputs.module }}
          side: infra
          dir: ${{ inputs.infra_dir }}
          step: apply
          environment: ${{ inputs.environment }}
          vault: ${{ inputs.vault }}
          key: ${{ secrets.WARD_KEY }}
          restricted-key: ${{ inputs.environment == 'production' && secrets[inputs.production_key_secret || format('WARD_KEY_{0}_RESTRICTED', inputs.vault)] || '' }}
          tag: ${{ inputs.tag }}
          previous-tag: ${{ needs.preflight.outputs.previous }}
          scopes: |
            ${{ inputs.environment == 'production' && format('{0}::restricted', inputs.vault) || inputs.vault }}:secrets.${{ inputs.module }}.infra.${{ inputs.environment }}
            ${{ inputs.environment == 'production' && format('{0}::restricted', inputs.vault) || inputs.vault }}:secrets.${{ inputs.module }}.code.${{ inputs.environment }}
  deployment:
    name: deployment
    environment: ${{ inputs.environment == 'production' && 'production' || 'staging' }}
    needs: [ preflight, apply ]
    if: ${{ !failure() && !cancelled() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.tag }}
      - name: deployment
        uses: br4zz4/pipelines/actions/step@v2
        with:
          module: ${{ inputs.module }}
          side: infra
          dir: ${{ inputs.infra_dir }}
          step: deployment
          environment: ${{ inputs.environment }}
          vault: ${{ inputs.vault }}
          key: ${{ secrets.WARD_KEY }}
          restricted-key: ${{ inputs.environment == 'production' && secrets[inputs.production_key_secret || format('WARD_KEY_{0}_RESTRICTED', inputs.vault)] || '' }}
          tag: ${{ inputs.tag }}
          previous-tag: ${{ needs.preflight.outputs.previous }}
  migrate:
    name: migrate
    environment: ${{ inputs.environment == 'production' && 'production' || 'staging' }}
    needs: [ preflight, apply ]
    if: ${{ !failure() && !cancelled() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.tag }}
      - name: migrate
        uses: br4zz4/pipelines/actions/step@v2
        with:
          module: ${{ inputs.module }}
          side: infra
          dir: ${{ inputs.infra_dir }}
          step: migrate
          environment: ${{ inputs.environment }}
          vault: ${{ inputs.vault }}
          key: ${{ secrets.WARD_KEY }}
          restricted-key: ${{ inputs.environment == 'production' && secrets[inputs.production_key_secret || format('WARD_KEY_{0}_RESTRICTED', inputs.vault)] || '' }}
          tag: ${{ inputs.tag }}
          previous-tag: ${{ needs.preflight.outputs.previous }}
  rollout:
    name: rollout
    environment: ${{ inputs.environment == 'production' && 'production' || 'staging' }}
    needs: [ preflight, apply, deployment, migrate ]
    if: ${{ !failure() && !cancelled() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.tag }}
      - name: rollout
        uses: br4zz4/pipelines/actions/step@v2
        with:
          module: ${{ inputs.module }}
          side: infra
          dir: ${{ inputs.infra_dir }}
          step: rollout
          environment: ${{ inputs.environment }}
          vault: ${{ inputs.vault }}
          key: ${{ secrets.WARD_KEY }}
          restricted-key: ${{ inputs.environment == 'production' && secrets[inputs.production_key_secret || format('WARD_KEY_{0}_RESTRICTED', inputs.vault)] || '' }}
          tag: ${{ inputs.tag }}
          previous-tag: ${{ needs.preflight.outputs.previous }}
  verify:
    name: verify
    environment: ${{ inputs.environment == 'production' && 'production' || 'staging' }}
    needs: [ preflight, apply, deployment, migrate, rollout ]
    if: ${{ !failure() && !cancelled() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      url: ${{ steps.verify.outputs.url }}
      release_url: ${{ steps.verify.outputs.release_url }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.tag }}
      - name: verify
        id: verify
        uses: br4zz4/pipelines/actions/step@v2
        with:
          module: ${{ inputs.module }}
          side: infra
          dir: ${{ inputs.infra_dir }}
          step: verify
          environment: ${{ inputs.environment }}
          vault: ${{ inputs.vault }}
          key: ${{ secrets.WARD_KEY }}
          restricted-key: ${{ inputs.environment == 'production' && secrets[inputs.production_key_secret || format('WARD_KEY_{0}_RESTRICTED', inputs.vault)] || '' }}
          tag: ${{ inputs.tag }}
          previous-tag: ${{ needs.preflight.outputs.previous }}
      - name: artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: verify-${{ inputs.module }}-${{ inputs.environment }}-${{ inputs.tag }}
          path: ${{ inputs.code_dir }}/tmp/artifacts
          if-no-files-found: ignore
  record:
    name: record
    needs: [ preflight, apply, deployment, migrate, rollout, verify ]
    if: ${{ always() && needs.deployment.result != 'skipped' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
      actions: write
    outputs:
      status: ${{ steps.rollback.outputs.status }}
      target: ${{ steps.rollback.outputs.target }}
      detail: ${{ steps.rollback.outputs.detail }}
    steps:
      - name: record
        uses: br4zz4/pipelines/actions/record@v2
        with:
          environment: ${{ inputs.environment }}
          module: ${{ inputs.module }}
          tag: ${{ inputs.tag }}
          state: ${{ needs.verify.result == 'success' && 'success' || 'failure' }}
          url: ${{ needs.verify.outputs.url }}
          release_url: ${{ needs.verify.outputs.release_url }}
      - name: rollback
        id: rollback
        if: ${{ !cancelled() && inputs.rollback_of == '' && (needs.deployment.result == 'failure' || needs.migrate.result == 'failure' || needs.rollout.result == 'failure' || needs.verify.result == 'failure') }}
        uses: br4zz4/pipelines/actions/rollback@v2
        with:
          environment: ${{ inputs.environment }}
          module: ${{ inputs.module }}
          tag: ${{ inputs.tag }}
          previous: ${{ needs.preflight.outputs.previous }}
          token: ${{ github.token }}
  notify:
    name: notify
    needs: [ preflight, apply, deployment, migrate, rollout, verify, record ]
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: secrets
        uses: br4zz4/setup-ward@v1
        with:
          vault: ${{ inputs.vault }}
          key: ${{ secrets.WARD_KEY }}
          scopes: ${{ inputs.vault }}:secrets.ci.common
      - name: outcome
        id: outcome
        env:
          VERIFY: ${{ needs.verify.result }}
          ROLLBACK_OF: ${{ inputs.rollback_of }}
          TAG: ${{ inputs.tag }}
          ROLLBACK_DETAIL: ${{ needs.record.outputs.detail }}
          ROLLBACK_STATUS: ${{ needs.record.outputs.status }}
          ROLLBACK_EXPECTED: ${{ needs.deployment.result == 'failure' || needs.migrate.result == 'failure' || needs.rollout.result == 'failure' || needs.verify.result == 'failure' }}
        run: |
          if [ "${VERIFY}" = "success" ]; then
            if [ -n "${ROLLBACK_OF}" ]; then
              echo "status=rolled back" >> "${GITHUB_OUTPUT}"
              echo "detail=${TAG} after ${ROLLBACK_OF} failed" >> "${GITHUB_OUTPUT}"
            else
              echo "status=ok" >> "${GITHUB_OUTPUT}"
              echo "detail=" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "status=failed" >> "${GITHUB_OUTPUT}"
            if [ -n "${ROLLBACK_OF}" ]; then
              echo "detail=rollback of ${ROLLBACK_OF} failed" >> "${GITHUB_OUTPUT}"
            elif [ "${ROLLBACK_EXPECTED}" = "true" ] && [ -z "${ROLLBACK_STATUS}" ]; then
              echo "detail=rollback dispatch failed" >> "${GITHUB_OUTPUT}"
            else
              echo "detail=${ROLLBACK_DETAIL}" >> "${GITHUB_OUTPUT}"
            fi
          fi
      - name: notify
        uses: br4zz4/pipelines/actions/notify@v2
        with:
          environment: ${{ inputs.environment }}
          module: ${{ inputs.module }}
          tag: ${{ inputs.tag }}
          url: ${{ needs.verify.outputs.url }}
          webhook: ${{ env.NOTIFY_WEBHOOK_URL }}
          status: ${{ steps.outcome.outputs.status }}
          detail: ${{ steps.outcome.outputs.detail }}
