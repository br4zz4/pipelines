# pr — the checks of one module on a pull request. Called by the project's own
# generated pr.yml, one job per module; the jobs of a module run in parallel.
name: pr

on:
  workflow_call:
    inputs:
      module:
        description: Module name
        required: true
        type: string
      vault:
        description: Ward namespace of the project
        required: true
        type: string
      code:
        description: The code side of the module changed
        required: false
        type: boolean
        default: true
      infra:
        description: The infra side of the module changed
        required: false
        type: boolean
        default: true
      services:
        description: Comma list of services the tests need (postgres, redis)
        required: false
        type: string
        default: ''
      code_dir:
        description: Directory of the code side
        required: true
        type: string
      infra_dir:
        description: Directory of the infra side
        required: true
        type: string
    secrets:
      WARD_KEY:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    name: check / lint
    if: ${{ inputs.code }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: lint
        uses: br4zz4/pipelines/actions/step@v1
        with:
          module: ${{ inputs.module }}
          side: code
          dir: ${{ inputs.code_dir }}
          step: lint
          environment: test
          vault: ${{ inputs.vault }}
          key: ${{ secrets.WARD_KEY }}
  audit:
    name: check / audit
    if: ${{ inputs.code }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: audit
        uses: br4zz4/pipelines/actions/step@v1
        with:
          module: ${{ inputs.module }}
          side: code
          dir: ${{ inputs.code_dir }}
          step: audit
          environment: test
          vault: ${{ inputs.vault }}
          key: ${{ secrets.WARD_KEY }}
  test:
    name: check / test
    if: ${{ inputs.code }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    services:
      postgres:
        image: ${{ contains(inputs.services, 'postgres') && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: ${{ contains(inputs.services, 'redis') && 'redis:7-alpine' || '' }}
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: test
        uses: br4zz4/pipelines/actions/step@v1
        with:
          module: ${{ inputs.module }}
          side: code
          dir: ${{ inputs.code_dir }}
          step: test
          environment: test
          vault: ${{ inputs.vault }}
          key: ${{ secrets.WARD_KEY }}
  validate:
    name: check / validate
    if: ${{ inputs.infra }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: validate
        uses: br4zz4/pipelines/actions/step@v1
        with:
          module: ${{ inputs.module }}
          side: infra
          dir: ${{ inputs.infra_dir }}
          step: validate
          environment: test
          vault: ${{ inputs.vault }}
          key: ${{ secrets.WARD_KEY }}
  plan:
    name: check / plan
    if: ${{ inputs.infra && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: plan
        uses: br4zz4/pipelines/actions/step@v1
        with:
          module: ${{ inputs.module }}
          side: infra
          dir: ${{ inputs.infra_dir }}
          step: plan
          environment: staging
          vault: ${{ inputs.vault }}
          key: ${{ secrets.WARD_KEY }}
