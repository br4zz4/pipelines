# infra — a trilha de infraestrutura de UM módulo. Separada do código de propósito:
# terraform só muta dentro do deploy, nunca no check nem na main.
name: infra

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      mode:
        description: 'plan (check + plan, somente leitura) | apply (aplica a tag)'
        required: false
        type: string
        default: plan
      changed:
        required: false
        type: string
        default: 'true'
      tag:
        description: Tag do release (o apply roda no código dela)
        required: false
        type: string
        default: ''
      module_dir:
        required: true
        type: string
      tf_dir:
        required: true
        type: string
      tf_check_dir:
        required: true
        type: string
      tf_bucket:
        required: true
        type: string
      tf_state_prefix:
        required: true
        type: string
      tf_vars:
        description: JSON das variáveis do terraform; {tag} vira a tag do release
        required: false
        type: string
        default: '{}'
      region:
        required: false
        type: string
        default: us-west1
    secrets:
      GCP_WIF_PROVIDER:
        required: false
      GCP_DEPLOY_SA:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  check:
    if: inputs.changed == 'true' && inputs.mode == 'plan'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt and validate
        uses: br4zz4/pipelines/actions/terraform@v1
        with:
          mode: check
          dir: ${{ inputs.tf_dir }}
          check_dir: ${{ inputs.tf_check_dir }}
          bucket: ${{ inputs.tf_bucket }}
          state_prefix: ${{ inputs.tf_state_prefix }}
          vars: ${{ inputs.tf_vars }}
          tag: ${{ inputs.tag }}
          module_dir: ${{ inputs.module_dir }}

  plan:
    if: >-
      inputs.changed == 'true' && inputs.mode == 'plan' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform plan (read-only)
        uses: br4zz4/pipelines/actions/terraform@v1
        with:
          mode: plan
          dir: ${{ inputs.tf_dir }}
          check_dir: ${{ inputs.tf_check_dir }}
          bucket: ${{ inputs.tf_bucket }}
          state_prefix: ${{ inputs.tf_state_prefix }}
          vars: ${{ inputs.tf_vars }}
          tag: ${{ inputs.tag }}
          module_dir: ${{ inputs.module_dir }}

  apply:
    if: inputs.changed == 'true' && inputs.mode == 'apply'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform apply (release)
        uses: br4zz4/pipelines/actions/terraform@v1
        with:
          mode: apply
          dir: ${{ inputs.tf_dir }}
          check_dir: ${{ inputs.tf_check_dir }}
          bucket: ${{ inputs.tf_bucket }}
          state_prefix: ${{ inputs.tf_state_prefix }}
          vars: ${{ inputs.tf_vars }}
          tag: ${{ inputs.tag }}
          module_dir: ${{ inputs.module_dir }}
