# promote — one release of one module that is green in staging. regression (the
# whole suite on a runner) and e2e (real tests against the Release URL) run in
# parallel; when both pass the release is recorded as promoted and the production
# deploy is dispatched, otherwise a Critical issue is opened.
#
#   regression ∥ e2e ─┬─► promote ─┐
#                     └─► report ──┴─► notify
name: promote

on:
  workflow_call:
    inputs:
      module:
        description: Module name
        required: true
        type: string
      vault:
        description: Ward namespace of the project
        required: true
        type: string
      tag:
        description: Release tag, `<module>.YYYY-MM-DD.NNN`
        required: true
        type: string
      code_dir:
        description: Directory of the code side
        required: true
        type: string
      services:
        description: Comma list of services the regression needs (postgres, redis)
        required: false
        type: string
        default: ''
      release_url:
        description: Release URL the e2e hook tests, from the staging record
        required: true
        type: string
      max_per_day:
        description: Promotions allowed per 24 hours; 0 means no limit
        required: false
        type: number
        default: 0
    secrets:
      WARD_KEY:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  regression:
    name: regression
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    services:
      postgres:
        image: ${{ contains(inputs.services, 'postgres') && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: ${{ contains(inputs.services, 'redis') && 'redis:7-alpine' || '' }}
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: regression
        uses: br4zz4/pipelines/actions/step@v2
        with:
          module: ${{ inputs.module }}
          side: code
          dir: ${{ inputs.code_dir }}
          step: regression
          environment: test
          vault: ${{ inputs.vault }}
          key: ${{ secrets.WARD_KEY }}
          scopes: ${{ inputs.vault }}:secrets.ci.test
          tag: ${{ inputs.tag }}
      - name: failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failures-regression
          path: ${{ inputs.code_dir }}/tmp/artifacts
          if-no-files-found: ignore
  e2e:
    name: e2e
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: e2e
        uses: br4zz4/pipelines/actions/step@v2
        with:
          module: ${{ inputs.module }}
          side: code
          dir: ${{ inputs.code_dir }}
          step: e2e
          environment: staging
          vault: ${{ inputs.vault }}
          key: ${{ secrets.WARD_KEY }}
          scopes: |
            ${{ inputs.vault }}:secrets.ci.staging
            ${{ inputs.vault }}:secrets.${{ inputs.module }}.code.staging
          tag: ${{ inputs.tag }}
          target-url: ${{ inputs.release_url }}
      - name: failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failures-e2e
          path: ${{ inputs.code_dir }}/tmp/artifacts
          if-no-files-found: ignore
  promote:
    name: promote
    needs: [ regression, e2e ]
    if: ${{ needs.regression.result == 'success' && needs.e2e.result == 'success' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      actions: write
    outputs:
      outcome: ${{ steps.promote.outputs.outcome }}
    steps:
      - name: promote
        id: promote
        uses: br4zz4/pipelines/actions/promote@v2
        with:
          command: decide
          tag: ${{ inputs.tag }}
          module: ${{ inputs.module }}
          max_per_day: ${{ inputs.max_per_day }}
          token: ${{ github.token }}
  report:
    name: report
    needs: [ regression, e2e ]
    if: ${{ always() && (needs.regression.result == 'failure' || needs.e2e.result == 'failure') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: secrets
        uses: br4zz4/setup-ward@v1
        with:
          vault: ${{ inputs.vault }}
          key: ${{ secrets.WARD_KEY }}
          scopes: ${{ inputs.vault }}:secrets.ci.common
      - name: failures regression
        if: ${{ needs.regression.result == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: failures-regression
          path: failures/regression
      - name: failures e2e
        if: ${{ needs.e2e.result == 'failure' }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: failures-e2e
          path: failures/e2e
      - name: critical regression
        if: ${{ needs.regression.result == 'failure' }}
        uses: br4zz4/pipelines/actions/critical@v2
        with:
          command: open
          module: ${{ inputs.module }}
          hook: regression
          tag: ${{ inputs.tag }}
          failures: failures/regression/failures.md
          output: failures/regression/output.log
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          token: ${{ env.GH_PIPELINES_TOKEN }}
      - name: critical e2e
        if: ${{ needs.e2e.result == 'failure' }}
        uses: br4zz4/pipelines/actions/critical@v2
        with:
          command: open
          module: ${{ inputs.module }}
          hook: e2e
          tag: ${{ inputs.tag }}
          failures: failures/e2e/failures.md
          output: failures/e2e/output.log
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          token: ${{ env.GH_PIPELINES_TOKEN }}
  notify:
    name: notify
    needs: [ regression, e2e, promote, report ]
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: secrets
        uses: br4zz4/setup-ward@v1
        with:
          vault: ${{ inputs.vault }}
          key: ${{ secrets.WARD_KEY }}
          scopes: ${{ inputs.vault }}:secrets.ci.common
      - name: notify
        uses: br4zz4/pipelines/actions/notify@v2
        with:
          environment: staging
          module: ${{ inputs.module }}
          tag: ${{ inputs.tag }}
          url: ${{ inputs.release_url }}
          webhook: ${{ env.NOTIFY_WEBHOOK_URL }}
          kind: promote
          status: ${{ needs.promote.outputs.outcome != '' && needs.promote.outputs.outcome || 'failed' }}
