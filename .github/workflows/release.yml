# release — push on the main branch. Checks, builds and stamps. Never deploys.
# The annotated tag is the only channel between the build and the deploy: its
# `tracks:` line lists the modules of the release.
#
# Usage:
#   jobs:
#     release:
#       uses: br4zz4/pipelines/.github/workflows/release.yml@v1
#       secrets:
#         GH_TAG_TOKEN: ${{ secrets.GH_TAG_TOKEN }}
#         RUNTIME_CONFIG: ${{ secrets.RUNTIME_CONFIG }}
name: release

on:
  workflow_call:
    inputs:
      registry:
        description: Path to modules.json
        required: false
        type: string
        default: .github/modules.json
    secrets:
      GH_TAG_TOKEN:
        required: true
      RUNTIME_CONFIG:
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.plan.outputs.code }}
      release: ${{ steps.plan.outputs.release }}
      tracks: ${{ steps.plan.outputs.tracks }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: plan
        uses: br4zz4/pipelines/actions/plan@v1
        with:
          mode: check
          registry: ${{ inputs.registry }}

  tag:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute release tag
        id: tag
        uses: br4zz4/pipelines/actions/tag@v1

  code:
    needs: [ plan, tag ]
    if: needs.plan.outputs.any == 'true'
    name: code · ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.release) }}
    uses: br4zz4/pipelines/.github/workflows/subtrack.yml@v1
    with:
      module: ${{ matrix.module }}
      dir: ${{ matrix.code_dir }}
      changed: ${{ matrix.code_changed }}
      steps_matrix: ${{ matrix.steps_matrix }}
      package: ${{ matrix.package }}
      environment: staging
      tag: ${{ needs.tag.outputs.tag }}
    secrets:
      RUNTIME_CONFIG: ${{ secrets.RUNTIME_CONFIG }}

  stamp:
    needs: [ plan, tag, code ]
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Stamp the release tag
        uses: br4zz4/pipelines/actions/stamp@v1
        with:
          tag: ${{ needs.tag.outputs.tag }}
          tracks: ${{ needs.plan.outputs.tracks }}
          token: ${{ secrets.GH_TAG_TOKEN }}
