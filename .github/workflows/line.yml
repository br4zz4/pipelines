# line — a linha de deploy de UM módulo, a mesma para staging e produção.
#
#   ship ─┬─ smoke ────────┐
#         └─ end-to-end ───┴─ record ─► notify     (sucesso)
#                          └─ rollback            (falha)
#
# O terraform não mora aqui: é a trilha infra, aplicada antes por module.yml.
name: line

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      environment:
        required: true
        type: string
      tag:
        required: true
        type: string
      code_dir:
        required: false
        type: string
        default: ''
      steps_matrix:
        required: false
        type: string
        default: '{"include":[{"step":"none"}]}'
      e2e:
        required: false
        type: string
        default: 'false'
      module_dir:
        required: false
        type: string
        default: ''
      region:
        required: false
        type: string
        default: us-west1
      image:
        required: true
        type: string
      source_image:
        required: false
        type: string
        default: ''
      url:
        required: false
        type: string
        default: ''
      prefix:
        required: true
        type: string
      migrate:
        required: false
        type: string
        default: 'true'
      worker:
        required: false
        type: string
        default: 'true'
      health:
        required: false
        type: string
        default: /up
      artifacts:
        required: false
        type: string
        default: ''
    secrets:
      GCP_WIF_PROVIDER:
        required: true
      GCP_DEPLOY_SA:
        required: true
      GCP_SOURCE_WIF_PROVIDER:
        required: false
      GCP_SOURCE_DEPLOY_SA:
        required: false
      NOTIFY_WEBHOOK_URL:
        required: false

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  ship:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    outputs:
      web_revision: ${{ steps.snapshot.outputs.web_revision }}
      worker_revision: ${{ steps.snapshot.outputs.worker_revision }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify tag and image
        uses: br4zz4/pipelines/actions/verify@v1
        with:
          tag: ${{ inputs.tag }}
          image: ${{ inputs.source_image || inputs.image }}
          region: ${{ inputs.region }}
          module_dir: ${{ inputs.module_dir }}

      - name: Snapshot current revisions
        id: snapshot
        uses: br4zz4/pipelines/actions/snapshot@v1
        with:
          prefix: ${{ inputs.prefix }}
          region: ${{ inputs.region }}
          module_dir: ${{ inputs.module_dir }}

      - name: Docker login (Artifact Registry)
        if: inputs.source_image != inputs.image
        run: gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin "https://${{ inputs.region }}-docker.pkg.dev"

      - name: Promote image (same digest, no rebuild)
        if: inputs.source_image != inputs.image
        uses: br4zz4/pipelines/actions/promote@v1
        with:
          source: ${{ inputs.source_image }}
          image: ${{ inputs.image }}
          tag: ${{ inputs.tag }}
          module_dir: ${{ inputs.module_dir }}

      - name: Run migrations
        if: inputs.migrate == 'true'
        uses: br4zz4/pipelines/actions/migrate@v1
        with:
          job: ${{ inputs.prefix }}-migrate
          image: ${{ inputs.image }}
          tag: ${{ inputs.tag }}
          region: ${{ inputs.region }}
          module_dir: ${{ inputs.module_dir }}

      - name: Deploy web and worker in parallel
        uses: br4zz4/pipelines/actions/services@v1
        with:
          prefix: ${{ inputs.prefix }}
          worker: ${{ inputs.worker }}
          image: ${{ inputs.image }}
          tag: ${{ inputs.tag }}
          region: ${{ inputs.region }}
          module_dir: ${{ inputs.module_dir }}

  smoke:
    needs: ship
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Smoke test (/up)
        uses: br4zz4/pipelines/actions/smoke@v1
        with:
          prefix: ${{ inputs.prefix }}
          url: ${{ inputs.url }}
          region: ${{ inputs.region }}
          path: ${{ inputs.health }}
          module_dir: ${{ inputs.module_dir }}

  end-to-end:
    needs: ship
    if: inputs.e2e == 'true' && vars.E2E_ENABLED != 'false'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up the module
        id: setup
        if: hashFiles('.github/actions/setup/action.yml') != ''
        uses: ./.github/actions/setup
        with:
          dir: ${{ inputs.code_dir }}

      - name: Run end-to-end tests
        uses: br4zz4/pipelines/actions/hook@v1
        with:
          step: e2e
          dir: ${{ inputs.code_dir }}

      - name: Keep artifacts from failed tests
        if: failure() && inputs.artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ inputs.module }}-${{ inputs.environment }}-${{ inputs.tag }}
          path: ${{ github.workspace }}/${{ inputs.code_dir }}/${{ inputs.artifacts }}
          if-no-files-found: ignore

  record:
    needs: [ ship, smoke, end-to-end ]
    if: >-
      ${{ always() && needs.ship.result == 'success' && needs.smoke.result == 'success' &&
          (needs.end-to-end.result == 'success' || needs.end-to-end.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - name: Record the release as green
        uses: br4zz4/pipelines/actions/record@v1
        with:
          environment: ${{ inputs.environment }}
          module: ${{ inputs.module }}
          tag: ${{ inputs.tag }}
          url: ${{ inputs.url }}
          module_dir: ${{ inputs.module_dir }}

  notify:
    needs: [ record ]
    if: ${{ always() && needs.record.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Notify success
        uses: br4zz4/pipelines/actions/notify@v1
        with:
          environment: ${{ inputs.environment }}
          module: ${{ inputs.module }}
          tag: ${{ inputs.tag }}
          url: ${{ inputs.url }}
          webhook: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          status: ok

  rollback:
    needs: [ ship, smoke, end-to-end ]
    if: >-
      ${{ always() && needs.ship.outputs.web_revision != '' &&
          (needs.ship.result == 'failure' || needs.smoke.result == 'failure' || needs.end-to-end.result == 'failure') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Roll back traffic to the previous revision
        uses: br4zz4/pipelines/actions/rollback@v1
        with:
          prefix: ${{ inputs.prefix }}
          web_revision: ${{ needs.ship.outputs.web_revision }}
          worker_revision: ${{ needs.ship.outputs.worker_revision }}
          region: ${{ inputs.region }}
          module_dir: ${{ inputs.module_dir }}

      - name: Smoke test after rollback
        uses: br4zz4/pipelines/actions/smoke@v1
        with:
          prefix: ${{ inputs.prefix }}
          url: ${{ inputs.url }}
          region: ${{ inputs.region }}
          path: ${{ inputs.health }}
          module_dir: ${{ inputs.module_dir }}
