# setup-action.yml — copy to .github/actions/setup/action.yml. The project owns
# the authentication; the pipeline calls it after the ward secrets and the
# toolchain (mise, which installs the Heroku CLI) are in place.
#
# The ward scope secrets.ci.<environment> exports HEROKU_API_KEY.
name: setup
description: Heroku credentials for one module side
inputs:
  dir:
    description: Module side directory, relative to the workspace
    required: true
  environment:
    description: test | staging | production
    required: true
runs:
  using: composite
  steps:
    - name: heroku login
      if: env.HEROKU_API_KEY != ''
      shell: bash
      run: heroku container:login
