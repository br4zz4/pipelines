# setup-action.yml — copy to .github/actions/setup/action.yml. The project owns
# the toolchain and the authentication; the pipeline calls it with `dir`,
# `environment` and `runtime-config` after checkout.
name: setup
description: Toolchain and credentials for one module
inputs:
  dir:
    description: Module directory, relative to the workspace
    required: true
  environment:
    description: staging | production
    required: true
  runtime-config:
    description: Opaque JSON secret with the project's runtime values
    default: ''
runs:
  using: composite
  steps:
    - name: Ruby
      uses: ruby/setup-ruby@v1
      with:
        working-directory: ${{ inputs.dir }}
        bundler-cache: true

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/000000000000/locations/global/workloadIdentityPools/pool/providers/provider
        service_account: deploy@project-id-here.iam.gserviceaccount.com

    - name: gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
