# setup-action.yml — copy to .github/actions/setup/action.yml. The project owns
# the authentication and the system packages; the pipeline calls it after the
# ward secrets and the toolchain (mise) are in place, with `dir` and `environment`.
# It never installs a language: that is the module's mise.toml.
#
# The ward scope secrets.ci.<environment> exports WIF_PROVIDER and DEPLOY_SA.
name: setup
description: Cloud credentials for one module side
inputs:
  dir:
    description: Module side directory, relative to the workspace
    required: true
  environment:
    description: test | staging | production
    required: true
  step:
    description: Hook being run (lint, audit, test, build, validate, plan, apply, rollout, verify, rollback)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: google cloud
      if: env.WIF_PROVIDER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.DEPLOY_SA }}

    - name: gcloud
      if: env.WIF_PROVIDER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: google-github-actions/setup-gcloud@v3
