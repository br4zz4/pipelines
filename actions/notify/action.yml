name: notify
description: Write the result to the run summary and, when a webhook is configured, post it.
inputs:
  environment:
    description: Environment the release is live in
    required: true
  module:
    description: Module the deployment belongs to
    required: true
  tag:
    description: Release tag
    required: true
  url:
    description: Environment URL, normally the `url` output of glide
    default: ''
  webhook:
    description: Incoming webhook (Slack-compatible payload); empty keeps it in the run summary
    default: ''
  status:
    description: Result of the deploy
    default: ok
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        MODULE: ${{ inputs.module }}
        TAG_INPUT: ${{ inputs.tag }}
        APP_URL: ${{ inputs.url }}
        NOTIFY_WEBHOOK_URL: ${{ inputs.webhook }}
        STATUS: ${{ inputs.status }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: sh "${{ github.action_path }}/notify.sh"
