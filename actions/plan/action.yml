name: plan
description: Resolve the run's tracks into matrices (event diff, or a release tag).
inputs:
  mode:
    description: check | release
    default: check
  environment:
    description: staging | production
    default: staging
  ref:
    description: Release tag (mode release). Empty resolves the newest release recorded green in `environment`.
    default: ''
  modules:
    description: Comma list to narrow a release to these modules. Empty means every module carried by the tag.
    default: ''
  registry:
    description: Path to modules.json
    default: .github/modules.json
outputs:
  code:
    description: Matrix for the code facet (mode check)
    value: ${{ steps.plan.outputs.code }}
  infra:
    description: Matrix for the infra facet (mode check)
    value: ${{ steps.plan.outputs.infra }}
  modules:
    description: Matrix of module deploys (mode release)
    value: ${{ steps.plan.outputs.modules }}
  tracks:
    description: Comma list of tracks, e.g. main/code,checkout/infra
    value: ${{ steps.plan.outputs.tracks }}
  tag:
    description: Resolved release tag (mode release)
    value: ${{ steps.plan.outputs.tag }}
  any:
    description: true when at least one track is in the run
    value: ${{ steps.plan.outputs.any }}
runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_MODULES: ${{ inputs.modules }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        EVENT_BEFORE: ${{ github.event.before }}
        EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        GH_TOKEN: ${{ github.token }}
      run: python3 "${{ github.action_path }}/plan.py"
