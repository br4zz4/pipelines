name: stamp
description: Create and push the annotated release tag.
inputs:
  tag:
    description: Release tag, `<module>.YYYY.MM.DD.N`
    required: true
  token:
    description: PAT with the `workflow` scope (a GITHUB_TOKEN push does not trigger workflows)
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TAG_INPUT: ${{ inputs.tag }}
        GH_TAG_TOKEN: ${{ inputs.token }}
      run: sh "${{ github.action_path }}/stamp.sh"
