name: verify
description: A deploy only runs a real release — the tag exists, has the expected shape and points at this commit.
inputs:
  tag:
    description: Release tag
    required: true
  module_dir:
    description: Module directory, for a project override at deploy/ci/verify.sh
    default: .
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TAG_INPUT: ${{ inputs.tag }}
        MODULE_DIR: ${{ inputs.module_dir }}
      run: sh "${{ github.action_path }}/verify.sh"
