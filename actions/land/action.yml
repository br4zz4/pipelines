name: land
description: Record the release as green in the environment (GitHub Deployments). Production promotes only what is recorded here.
inputs:
  environment:
    description: Environment the release is live in
    required: true
  module:
    description: Module the deployment belongs to
    required: true
  tag:
    description: Release tag
    required: true
  url:
    description: Environment URL, normally the `url` output of glide
    default: ''
  dir:
    description: Module infra directory, for a project override at <dir>/ci/land.sh
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        MODULE: ${{ inputs.module }}
        TAG_INPUT: ${{ inputs.tag }}
        APP_URL: ${{ inputs.url }}
        DIR: ${{ inputs.dir }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: sh "${{ github.action_path }}/land.sh"
