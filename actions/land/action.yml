name: land
description: Record the release as green in the environment (GitHub Deployments). Production only promotes what is recorded here.
inputs:
  environment:
    description: Environment the release is live in
    required: true
  module:
    description: Module the deployment belongs to
    required: true
  tag:
    description: Release tag
    required: true
  url:
    description: Environment URL
    default: ''
  module_dir:
    description: Module directory, for a project override at deploy/ci/land.sh
    default: .
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        MODULE: ${{ inputs.module }}
        TAG_INPUT: ${{ inputs.tag }}
        APP_URL: ${{ inputs.url }}
        MODULE_DIR: ${{ inputs.module_dir }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: sh "${{ github.action_path }}/land.sh"
