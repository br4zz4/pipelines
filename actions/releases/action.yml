name: releases
description: The releases a deploy run raises, and the environment it raises them in, decided by the event and the ref.
inputs:
  registry:
    description: Path to modules.json
    default: .github/modules.json
outputs:
  releases:
    description: 'JSON {"<module>": "<tag>" or ""} with every module of the registry'
    value: ${{ steps.releases.outputs.releases }}
  environment:
    description: staging for a tag push, production for a dispatch
    value: ${{ steps.releases.outputs.environment }}
runs:
  using: composite
  steps:
    - id: releases
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: sh "${{ github.action_path }}/releases.sh"
