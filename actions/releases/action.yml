name: releases
description: The releases a deploy run raises, and the environment it raises them in, decided by the event and the ref.
inputs:
  registry:
    description: Path to modules.json
    default: .github/modules.json
  environment:
    description: Override environment for dispatch (staging | production); empty = auto-detect
    default: ''
  rollback_to:
    description: Release to deploy instead of the ref, set by a failed deploy (dispatch only); empty is a plain deploy
    default: ''
outputs:
  code_dir:
    description: Directory of the code side of the module; empty when module is empty
    value: ${{ steps.releases.outputs.code_dir }}
  infra_dir:
    description: Directory of the infra side of the module; empty when module is empty
    value: ${{ steps.releases.outputs.infra_dir }}
  rollback_of:
    description: The failed release this deploy rolls back from; empty for a plain deploy
    value: ${{ steps.releases.outputs.rollback_of }}
  releases:
    description: 'JSON {"<module>": "<tag>" or ""} with every module of the registry'
    value: ${{ steps.releases.outputs.releases }}
  environment:
    description: staging for a tag push, production for a dispatch
    value: ${{ steps.releases.outputs.environment }}
  module:
    description: Module named by the tag; empty when multiple modules are active (branch dispatch)
    value: ${{ steps.releases.outputs.module }}
  services:
    description: Comma-separated services for the module (e.g. postgres,redis); empty when module is empty
    value: ${{ steps.releases.outputs.services }}
  tag:
    description: Release tag for the named module; empty when module is empty
    value: ${{ steps.releases.outputs.tag }}
runs:
  using: composite
  steps:
    - name: releases
      id: releases
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        ENVIRONMENT_INPUT: ${{ inputs.environment }}
        ROLLBACK_TO: ${{ inputs.rollback_to }}
      run: sh "${{ github.action_path }}/releases.sh"
