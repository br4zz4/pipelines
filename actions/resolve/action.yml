name: resolve
description: The release tag of a module in an environment — the newest recorded green, or the one given.
inputs:
  environment:
    description: staging | production | promoted
    default: production
  module:
    description: Module the release belongs to. Derived from the tag when empty.
    default: ''
  tag:
    description: Release tag. Empty resolves the newest release recorded green in `environment`.
    default: ''
  wait:
    description: 'Seconds to poll for the record before giving up (0 = fail immediately).'
    default: '0'
outputs:
  tag:
    description: Release tag resolved for the module in the environment
    value: ${{ steps.resolve.outputs.tag }}
  release_url:
    description: Release URL kept in the record payload; empty when the record has none
    value: ${{ steps.resolve.outputs.release_url }}
runs:
  using: composite
  steps:
    - name: resolve
      id: resolve
      shell: bash
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_MODULE: ${{ inputs.module }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_WAIT: ${{ inputs.wait }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: python3 "${{ github.action_path }}/resolve.py"
