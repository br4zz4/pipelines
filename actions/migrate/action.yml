name: migrate
description: Point the module's migration job at the release image and run it to completion.
inputs:
  job:
    description: Cloud Run job that runs the migrations
    required: true
  image:
    description: Target image path, without the tag
    required: true
  tag:
    description: Release tag
    required: true
  region:
    description: Cloud Run region
    default: us-west1
  module_dir:
    description: Module deploy directory, for a project override at deploy/ci/migrate.sh
    default: .
runs:
  using: composite
  steps:
    - shell: bash
      env:
        JOB: ${{ inputs.job }}
        IMAGE: ${{ inputs.image }}
        TAG_INPUT: ${{ inputs.tag }}
        GCP_REGION: ${{ inputs.region }}
        MODULE_DIR: ${{ inputs.module_dir }}
      run: sh "${{ github.action_path }}/migrate.sh"
