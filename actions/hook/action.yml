name: hook
description: Run ci/<step>.sh inside a module directory. Used for every step, including prepare, apply, fly, glide and rollback.
inputs:
  step:
    description: Step name, matching <dir>/ci/<step>.sh
    required: true
  dir:
    description: Module directory, relative to the workspace
    required: true
outputs:
  rollback:
    description: Rollback point written by the step (fly), passed to rollback
    value: ${{ steps.run.outputs.rollback }}
  url:
    description: Environment URL written by the step (glide), passed to land and notify
    value: ${{ steps.run.outputs.url }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      working-directory: ${{ inputs.dir }}
      env:
        STEP: ${{ inputs.step }}
      run: sh "${{ github.action_path }}/hook.sh"
