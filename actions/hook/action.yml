name: hook
description: Run a hook inside a module side directory. Context is derived from the step name (checks or deploy). For lint, audit and test, run/<step> is preferred and ci/checks/<step>.sh is still accepted. Every hook of the vocabulary is mandatory; a missing script fails.
inputs:
  step:
    description: Step name, matching <dir>/ci/<context>/<step>.sh
    required: true
  dir:
    description: Module side directory (code or infra), relative to the workspace
    required: true
outputs:
  url:
    description: Environment URL written by the verify hook, passed to record and notify
    value: ${{ steps.run.outputs.url }}
runs:
  using: composite
  steps:
    - name: hook
      id: run
      shell: bash
      working-directory: ${{ inputs.dir }}
      env:
        STEP: ${{ inputs.step }}
      run: sh "${{ github.action_path }}/hook.sh"
