name: hook
description: Run ci/<context>/<step>.sh inside a module side directory. Every hook of the vocabulary is mandatory; a missing script fails.
inputs:
  step:
    description: Step name, matching <dir>/ci/<context>/<step>.sh
    required: true
  context:
    description: Hook context directory (code, infra, deploy)
    required: true
  dir:
    description: Module side directory (code or infra), relative to the workspace
    required: true
outputs:
  rollback:
    description: Rollback point written by the deploy hook, passed to rollback
    value: ${{ steps.run.outputs.rollback }}
  url:
    description: Environment URL written by the verify hook, passed to record and notify
    value: ${{ steps.run.outputs.url }}
runs:
  using: composite
  steps:
    - name: hook
      id: run
      shell: bash
      working-directory: ${{ inputs.dir }}
      env:
        STEP: ${{ inputs.step }}
        CONTEXT: ${{ inputs.context }}
      run: sh "${{ github.action_path }}/hook.sh"
