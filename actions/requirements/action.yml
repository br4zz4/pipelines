name: requirements
description: A deploy only runs a real release of a module — the tag has the module shape, is in git and points at this commit.
inputs:
  tag:
    description: Release tag, `<module>.YYYY.MM.DD.N` (legacy `v...` accepted)
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TAG_INPUT: ${{ inputs.tag }}
        GITHUB_SHA: ${{ github.sha }}
      run: sh "${{ github.action_path }}/requirements.sh"
