name: reuse
description: Whether a commit landed through a green pull request, so main may skip the steps it already proved.
inputs:
  module:
    description: Module name, e.g. core
    required: true
  subtrack:
    description: code | infra
    required: true
  steps:
    description: Comma list of the steps the pull request must have passed, e.g. lint,audit,test
    required: true
  sha:
    description: Commit to look at; defaults to the commit of the run
    default: ''
  check_prefix:
    description: 'Prefix of the check names in the pull request; defaults to `<subtrack> / <module> / `'
    default: ''
  token:
    description: 'Token with `checks: read` and `pull-requests: read`'
    required: true
outputs:
  reuse:
    description: '`true` when the pull request already proved these steps for this content'
    value: ${{ steps.reuse.outputs.reuse }}
  reason:
    description: Why reuse answered what it answered, for the log
    value: ${{ steps.reuse.outputs.reason }}
runs:
  using: composite
  steps:
    - id: reuse
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ github.repository }}
        SHA: ${{ inputs.sha || github.sha }}
        MODULE: ${{ inputs.module }}
        SUBTACK: ${{ inputs.subtrack }}
        STEPS: ${{ inputs.steps }}
        CHECK_PREFIX: ${{ inputs.check_prefix }}
      run: python3 "${{ github.action_path }}/reuse.py"
