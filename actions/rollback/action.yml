name: rollback
description: Move traffic back to the previous revisions. Database migrations are not reverted — they must be expand/contract.
inputs:
  web_revision:
    description: Revision to send 100% of web traffic to
    default: ''
  worker_revision:
    description: Revision to send 100% of worker traffic to
    default: ''
  prefix:
    description: Service name prefix
    required: true
  region:
    description: Cloud Run region
    default: us-west1
  module_dir:
    description: Module deploy directory, for a project override at deploy/ci/rollback.sh
    default: .
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PREFIX: ${{ inputs.prefix }}
        WEB_REVISION: ${{ inputs.web_revision }}
        WORKER_REVISION: ${{ inputs.worker_revision }}
        GCP_REGION: ${{ inputs.region }}
        MODULE_DIR: ${{ inputs.module_dir }}
      run: sh "${{ github.action_path }}/rollback.sh"
