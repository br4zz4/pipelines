name: detect
description: Turn the event's change set into one JSON saying which modules changed, and on which side (code or infra).
inputs:
  registry:
    description: Path to modules.json
    default: .github/modules.json
outputs:
  changes:
    description: 'JSON {"<module>": {"any": bool, "code": bool, "infra": bool}} with every module of the registry'
    value: ${{ steps.detect.outputs.changes }}
runs:
  using: composite
  steps:
    - name: detect
      id: detect
      shell: bash
      env:
        INPUT_REGISTRY: ${{ inputs.registry }}
        EVENT_BEFORE: ${{ github.event.before }}
        EVENT_BASE: ${{ github.event.pull_request.base.sha }}
      run: python3 "${{ github.action_path }}/detect.py"
