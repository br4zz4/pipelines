name: tag
description: Next release tag for a module — `<prefix>.YYYY-MM-DD.NNN` (day in America/Sao_Paulo, NNN sequential per day, zero-padded).
inputs:
  prefix:
    description: Module name the tag belongs to, e.g. main
    required: true
  zone:
    description: Timezone that defines the release day
    default: America/Sao_Paulo
outputs:
  tag:
    description: The tag, e.g. core.2026-11-13.001
    value: ${{ steps.tag.outputs.tag }}
runs:
  using: composite
  steps:
    - id: tag
      shell: bash
      env:
        PREFIX: ${{ inputs.prefix }}
        ZONE: ${{ inputs.zone }}
      run: sh "${{ github.action_path }}/tag.sh"
